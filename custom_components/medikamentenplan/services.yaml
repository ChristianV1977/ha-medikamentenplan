neue_packung:
  target:
    entity:
      integration: medikamentenplan
      domain: sensor
  fields:
    anbruchdatum:
      required: false
      selector:
        date:
    anzahl_packungen:
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 20
          mode: box
    hersteller:
      required: false
      selector:
        text:
    packungsgroesse:
      required: false
      selector:
        number:
          min: 0.01
          max: 10000
          step: any
          mode: box
